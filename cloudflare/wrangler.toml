# whitesim-lab.com 統計API（Cloudflare Workers + D1 + KV）
name = "whitesim-stats"
main = "src/index.js"
compatibility_date = "2026-06-01"

# 日次集計（UTC 20:00 = JST 05:00）
[triggers]
crons = ["0 20 * * *"]

# D1: `wrangler d1 create whitesim-stats` の出力で database_id を置き換える
[[d1_databases]]
binding = "DB"
database_name = "whitesim-stats"
database_id = "c73d4b7b-36dc-43fe-987f-01e23e288a0b"

# KV: `wrangler kv namespace create STATS` の出力で id を置き換える
[[kv_namespaces]]
binding = "STATS"
id = "1ddbc2db577642358ab2b4e7449ac3d0"

[vars]
ALLOWED_ORIGINS = "https://whitesim-lab.com,http://localhost:8000,http://127.0.0.1:8000"
WINDOW_DAYS = "90"        # 集計対象: 直近90日
MIN_PUBLISH = "10"        # n がこれ未満の世代は実測を非公開
MIN_TIER_SPLIT = "30"     # n がこれ以上の世代だけ課金帯別の内訳を出す
REVIEW_MAX = "100"        # 口コミを1世代あたり何件まで表示するか（新しい順）
REPORT_HIDE = "3"         # 通報がこの件数に達した口コミは自動で非表示（運営者が戻せる）
# --- シミュレーター利用データの「現実的な入力」の範囲（外れたものは保存するが集計から除外）---
USAGE_STAT_MAX = "3000"       # 攻撃%・殺傷% 1項目の上限
USAGE_STAT_SUM_MIN = "50"     # 攻撃%・殺傷% 8項目の合計の下限
USAGE_TROOPS_MIN = "1000"     # 兵士の合計数の下限
USAGE_TROOPS_MAX = "3000000"  # 兵士の合計数の上限
USAGE_DAMAGE_MAX = "50000000000"  # 予測ダメージの上限
USAGE_PER_IP_DAILY = "40"     # 同じIPから1日に新しく作れる記録の数
NG_WORDS = ""             # 追加のNGワード（カンマ区切り。組み込みの一覧に足される）

# シークレット（wrangler secret put で登録。toml には書かない）
#   TURNSTILE_SECRET … Turnstile のシークレットキー
#   CLIENT_SALT      … IP をハッシュ化するときの塩（ランダムな長い文字列）
#   ADMIN_KEY        … 口コミの管理画面（/stats/admin.html）で使う合言葉（ランダムな長い文字列）
